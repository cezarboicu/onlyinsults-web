<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">OnlyInsults mark</title>
  <desc id="desc">A stylized person hit by a diagonal spear inside a broken electric-blue circle.</desc>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="blue" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#006dff"/>
      <stop offset="1" stop-color="#4dc3ff"/>
    </linearGradient>
  </defs>
  <!-- broken target ring -->
  <path d="M201 55A91 91 0 0 0 44 93" fill="none" stroke="url(#blue)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M36 124a91 91 0 0 0 146 73" fill="none" stroke="url(#blue)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  <!-- person leaning back -->
  <circle cx="77" cy="126" r="14" fill="#fff"/>
  <path d="M82 144c20 7 31 21 38 39l-19 13c-10-17-24-26-44-31l7-25c6 1 12 2 18 4Z" fill="#fff"/>
  <path d="M63 161 43 190M91 176l-4 36M107 161l28-19" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
  <!-- impact -->
  <path d="m112 143 13-18 4 14 16-5-13 20-5-13Z" fill="#4dc3ff" filter="url(#glow)"/>
  <!-- spear shaft -->
  <path d="M28 215 190 53" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M39 204 29 216l13 1" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- spear head -->
  <path d="m184 59 45-30-24 49-10-10-11-9Z" fill="none" stroke="url(#blue)" stroke-width="9" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="m202 65 14-23" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
</svg>
